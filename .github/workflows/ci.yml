name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt && rustup default 1.96.1
      - run: rustc --version && cargo --version
      - name: Install Linux build and owned endpoint prerequisites
        shell: bash
        run: |
          # The runner also configures unrelated vendor repositories. These
          # dependencies come from its signed Ubuntu sources exclusively.
          termcraft_apt_sources=$(mktemp -d)
          trap 'rm -rf -- "$termcraft_apt_sources"' EXIT
          cp /etc/apt/sources.list.d/ubuntu.sources "$termcraft_apt_sources/ubuntu.sources"
          termcraft_apt_options=(-o Dir::Etc::sourcelist=/dev/null -o "Dir::Etc::sourceparts=$termcraft_apt_sources")
          sudo apt-get "${termcraft_apt_options[@]}" update
          sudo apt-get "${termcraft_apt_options[@]}" install -y --no-install-recommends \
            build-essential libx11-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libpcap-dev \
            openssh-client openssh-server openssl desktop-file-utils libglib2.0-bin vim less python3
          # OpenSSH requires its privilege-separation directory even when the
          # tests launch only their own unprivileged loopback endpoints.
          sudo install -d -m 0755 /run/sshd
      - name: Prepare independently locked RDP endpoint fixtures
        shell: bash
        run: |
          # The integration harness deliberately builds these offline. Root
          # Cargo.lock does not fetch their independent dependency graphs.
          for manifest in engines/rdp/Cargo.toml docs/parity-evidence/rdp-prototype/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
            cargo build --locked --offline --manifest-path "$manifest"
          done
      - run: cargo fmt --all --check
      - id: linux_rdp
        run: cargo test --locked --manifest-path engines/rdp/Cargo.toml
      - run: cargo test --locked --no-fail-fast
      - name: Verify shared XDMCP when the independent RDP suite fails
        if: ${{ !cancelled() && steps.linux_rdp.conclusion == 'failure' }}
        run: cargo test --locked --lib x11::xdmcp

  regression-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt
      - name: Provision the OpenSSL fixture command
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          if (!(Test-Path -LiteralPath $openssl)) { throw 'Git for Windows OpenSSL is unavailable.' }
          Split-Path $openssl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $openssl version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo +1.96.1 fmt --all -- --check
      - run: cargo +1.96.1 test --locked --manifest-path engines/rdp/Cargo.toml
      - run: cargo +1.96.1 test --locked --all-targets --no-fail-fast
      - name: Verify native Cron scheduling through Eastern DST transitions
        shell: pwsh
        run: |
          $original = (Get-TimeZone).Id
          try {
            Set-TimeZone -Id 'Eastern Standard Time' -ErrorAction Stop
            cargo +1.96.1 test --locked --lib services::cron::tests::native_windows_local_dst_gaps_and_repeated_instants -- --ignored --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Set-TimeZone -Id $original -ErrorAction Stop
          }

  regression-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      RUST_TEST_THREADS: "4"
      TERMCRAFT_REQUIRE_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt && rustup default 1.96.1
      - name: Verify Apple Silicon toolchain and owned endpoint prerequisites
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          rustc --version
          cargo --version
          # The SSH harness uses this installed absolute path for re-exec;
          # it starts its own loopback process, never the system SSH service.
          test -x /usr/sbin/sshd
          test -x /usr/bin/ssh-keygen
          test -x /usr/bin/vim
          test -x /usr/bin/less
          ssh -V
          # TLS fixtures require req -addext, which the system LibreSSL may
          # not support. Select the real Homebrew OpenSSL 3 command explicitly.
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          termcraft_openssl_bin="$(brew --prefix openssl@3)/bin"
          echo "$termcraft_openssl_bin" >> "$GITHUB_PATH"
          "$termcraft_openssl_bin/openssl" version
          termcraft_tls_check=$(mktemp -d)
          trap 'rm -rf -- "$termcraft_tls_check"' EXIT
          "$termcraft_openssl_bin/openssl" req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=TermCraft-CI-prerequisite -addext basicConstraints=critical,CA:TRUE \
            -keyout "$termcraft_tls_check/key.pem" -out "$termcraft_tls_check/cert.pem"
          # Keep Unix-domain fixture socket paths below Darwin's length limit.
          termcraft_tmpdir=$(mktemp -d /private/tmp/termcraft-ci-XXXXXXXX)
          echo "TMPDIR=$termcraft_tmpdir" >> "$GITHUB_ENV"
      - name: Prepare independently locked RDP endpoint fixtures
        shell: bash
        run: |
          for manifest in engines/rdp/Cargo.toml docs/parity-evidence/rdp-prototype/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
            cargo build --locked --offline --manifest-path "$manifest"
          done
      - run: cargo fmt --all --check
      - run: cargo test --locked --manifest-path engines/rdp/Cargo.toml
      - run: cargo test --locked --all-targets --no-fail-fast
      - name: Remove owned short-path fixture directory
        if: always()
        shell: bash
        run: |
          if [[ "$TMPDIR" == /private/tmp/termcraft-ci-* ]]; then
            rm -rf -- "$TMPDIR"
          fi
