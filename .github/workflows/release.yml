name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      native_gui:
        description: Require native GUI, RDP and package lifecycle qualification. Disabling this blocks assembly.
        type: boolean
        default: true
      windows_x_fixture:
        description: Build an unpublished Windows x64 X11 candidate and exercise its private desktop
        type: boolean
        default: false
      windows_vnc_fixture:
        description: Exercise native input on a disposable Windows runner desktop
        type: boolean
        default: false
      windows_printer_fixture:
        description: Verify the packaged printer worker with a disposable loopback RAW port
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  RUST_VERSION: "1.96.1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate.outputs.version }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      tag_publish_event: ${{ steps.validate.outputs.tag_publish_event }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source commit and Cargo package versions
        id: validate
        shell: bash
        run: |
          source_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          python scripts/release-delivery.py preflight --source "$source_sha" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --github-output "$GITHUB_OUTPUT"

  regression:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}

  package:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-amd64
            platform: linux
          - runner: windows-2025
            artifact: windows-amd64
            platform: windows
          - runner: macos-15
            artifact: macos-arm64
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    env:
      RELEASE_SOURCE: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Preserve committed source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'engines/rdp/Cargo.lock', 'engines/wayland/Cargo.lock', 'docs/parity-evidence/rdp-prototype/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - shell: bash
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - if: runner.os == 'Linux'
        name: Install Linux package and startup prerequisites
        shell: bash
        run: |
          # These dependencies use signed Ubuntu sources; unrelated vendor
          # repository failures must not prevent native package qualification.
          termcraft_apt_sources=$(mktemp -d)
          trap 'rm -rf -- "$termcraft_apt_sources"' EXIT
          cp /etc/apt/sources.list.d/ubuntu.sources "$termcraft_apt_sources/ubuntu.sources"
          termcraft_apt_options=(-o Dir::Etc::sourcelist=/dev/null -o "Dir::Etc::sourceparts=$termcraft_apt_sources")
          sudo apt-get "${termcraft_apt_options[@]}" update
          sudo apt-get "${termcraft_apt_options[@]}" install -y \
            binutils squashfs-tools zstd libx11-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libegl1-mesa-dev libegl-mesa0 libgl1-mesa-dev libgl1-mesa-dri xvfb xauth weston strace
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command llvm-objdump -ErrorAction SilentlyContinue)) {
            $reader = Join-Path $env:ProgramFiles 'LLVM\bin\llvm-objdump.exe'
            if (!(Test-Path -LiteralPath $reader)) { throw 'LLVM import inspection tool unavailable.' }
            Split-Path $reader | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Prepare macOS native package toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          cargo test --locked --manifest-path engines/rdp/Cargo.toml
      - run: cargo test --locked --test package_manifest --test package_version
      - if: runner.os == 'Windows'
        run: cargo test --locked --test cli_dispatch --test credential_vault
      - name: Verify native input on the disposable Windows desktop
        if: runner.os == 'Windows' && inputs.windows_vnc_fixture
        env:
          TERMCRAFT_VNC_DISPOSABLE_CONTROL: "1"
        run: cargo test --locked --lib windows_vnc_control_reaches_only_the_disposable_desktop_fixture -- --ignored --nocapture
      - name: Build unsigned core archive in an isolated output tree
        shell: bash
        run: |
          build_root=$(python -c 'import os, tempfile; print(tempfile.mkdtemp(prefix="termcraft-build-", dir=os.environ["RUNNER_TEMP"]))')
          echo "TERMCRAFT_RELEASE_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          python scripts/package-release.py --build-root "$build_root" --output dist
      - name: Build and verify the Linux Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive=(dist/TermCraft-*.tar.gz)
          test "${#archive[@]}" -eq 1
          python scripts/package-debian.py "${archive[0]}" --output dist
          dpkg-deb --info dist/termcraft_*.deb
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          dpkg-deb --raw-extract dist/termcraft_*.deb "$stage"
          (cd "$stage" && md5sum --quiet -c DEBIAN/md5sums)
          env PATH= "$stage/opt/termcraft/harbor-workspace" --help
      - name: Start the Linux archive under an owned X11 server
        if: runner.os == 'Linux' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          archive=(dist/TermCraft-*.tar.gz)
          test "${#archive[@]}" -eq 1
          xvfb-run -a -s '-screen 0 1440x1024x24' bash -c 'python scripts/package-check-startup.py "$1" --display "$DISPLAY" --evidence startup-evidence' _ "${archive[0]}"
      - name: Qualify the Linux archive on a private native Wayland compositor
        if: runner.os == 'Linux' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          archive=(dist/TermCraft-*.tar.gz)
          test "${#archive[@]}" -eq 1
          python scripts/package-check-wayland.py "${archive[0]}" --source "$RELEASE_SOURCE" \
            --evidence wayland-evidence --weston-log diagnostics/weston.log
      - name: Qualify Debian and per-user Linux desktop lifecycle
        if: runner.os == 'Linux' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1440x1024x24' python scripts/package-native-lifecycle.py qualify \
            --platform linux --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" --dist dist \
            --evidence lifecycle-evidence --build-root "$TERMCRAFT_RELEASE_BUILD_ROOT" --disposable-runner
      - name: Build the Linux AppImage and its corresponding source
        if: runner.os == 'Linux' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          mkdir "$work/runtime"
          python packaging/appimage/fetch-inputs.py "$work/inputs"
          docker build --platform linux/amd64 -f packaging/appimage/runtime.Dockerfile \
            -t termcraft-appimage-runtime:build packaging/appimage
          docker run --rm --platform linux/amd64 --network none \
            -v "$PWD/packaging/appimage:/recipe:ro" -v "$work/inputs:/inputs:ro" \
            -v "$work/runtime:/out" termcraft-appimage-runtime:build sh -ec 'trap "chown -R $1 /out" EXIT; sh /recipe/build-runtime.sh' _ "$(id -u):$(id -g)"
          archive="dist/TermCraft-$RELEASE_VERSION-linux-x86_64.tar.gz"
          python scripts/package-appimage.py "$archive" --inputs "$work/inputs" --runtime "$work/runtime" --output dist
          TERMCRAFT_APPIMAGE_TEST_CORE="$archive" TERMCRAFT_APPIMAGE_TEST_IMAGE="${archive%.tar.gz}.AppImage" \
            python -m unittest discover -s tests -p packaging_appimage.py
      - name: Qualify the outer Linux AppImage on X11 and native Wayland
        if: runner.os == 'Linux' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          base="dist/TermCraft-$RELEASE_VERSION-linux-x86_64"
          xvfb-run -a -s '-screen 0 1440x1024x24' bash -c 'python scripts/package-check-startup.py "$1.AppImage" --appimage-core "$1.tar.gz" --display "$DISPLAY" --evidence appimage-x11-evidence' _ "$base"
          python scripts/package-check-wayland.py "$base.AppImage" --appimage-core "$base.tar.gz" \
            --source "$RELEASE_SOURCE" --evidence appimage-wayland-evidence --weston-log diagnostics/appimage-weston.log
      - name: Start the macOS archive on the native desktop
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          archive=(dist/TermCraft-*.zip)
          test "${#archive[@]}" -eq 1
          python scripts/package-check-startup.py "${archive[0]}" --evidence startup-evidence
      - name: Qualify macOS install, replacement, relocation and removal
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.native_gui)
        shell: bash
        run: |
          python scripts/package-native-lifecycle.py qualify --platform macos --source "$RELEASE_SOURCE" \
            --version "$RELEASE_VERSION" --dist dist --evidence lifecycle-evidence \
            --build-root "$TERMCRAFT_RELEASE_BUILD_ROOT" --disposable-runner
      - name: Start the Windows archive and qualify the KnownFolder lifecycle
        if: runner.os == 'Windows' && (github.event_name == 'push' || inputs.native_gui)
        shell: pwsh
        run: |
          $fixture = Get-Content tests/windows-software-gl.json -Raw | ConvertFrom-Json
          $graphics = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'termcraft-software-gl')
          $download = Join-Path $graphics.FullName 'mesa.7z'
          Invoke-WebRequest -Uri $fixture.url -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne $fixture.sha256) { throw 'Mesa fixture checksum mismatch.' }
          $members = @($fixture.files.PSObject.Properties.Name | ForEach-Object { "x64/$_" })
          tar.exe -xf $download -C $graphics.FullName @members
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the pinned Mesa fixture.' }
          $softwareGl = Join-Path $graphics.FullName 'x64'
          $archive = @(Get-ChildItem dist -Filter 'TermCraft-*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows package.' }
          python scripts/package-check-startup.py $archive[0].FullName --evidence startup-evidence --windows-software-gl $softwareGl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-native-lifecycle.py qualify --platform windows --source $env:RELEASE_SOURCE `
            --version $env:RELEASE_VERSION --dist dist --evidence lifecycle-evidence `
            --build-root $env:TERMCRAFT_RELEASE_BUILD_ROOT --software-gl $softwareGl --disposable-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged Winspool worker with a disposable queue
        if: runner.os == 'Windows' && inputs.windows_printer_fixture
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem dist -Filter 'TermCraft-*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows package.' }
          $root = Join-Path $env:RUNNER_TEMP 'termcraft-print-fixture'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $root
          $helper = @(Get-ChildItem -LiteralPath $root -Recurse -Filter 'termcraft-rdp-engine.exe')
          if ($helper.Count -ne 1) { throw 'Expected exactly one packaged RDP helper.' }
          ./tests/windows-printer-fixture.ps1 -Helper $helper[0].FullName
      - name: Refuse to assemble an unqualified diagnostics run
        if: github.event_name == 'workflow_dispatch' && !inputs.native_gui
        shell: bash
        run: |
          echo '::error::Native startup was disabled. This run is diagnostics only.'
          exit 1
      - name: Verify packaged bytes and required native qualification evidence
        id: inventory
        shell: bash
        run: |
          wayland=()
          if [[ "$RELEASE_PLATFORM" == linux ]]; then wayland=(--wayland wayland-evidence); fi
          python scripts/release-delivery.py inventory --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" \
            --platform "$RELEASE_PLATFORM" --dist dist --startup startup-evidence \
            --lifecycle lifecycle-evidence "${wayland[@]}" --output "candidate-$ARTIFACT"
        env:
          ARTIFACT: ${{ matrix.artifact }}
      - name: Upload validated native candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.artifact }}
          path: candidate-${{ matrix.artifact }}/
          if-no-files-found: error
          overwrite: true
      - name: Summarize native package validation
        if: always() && !cancelled()
        shell: bash
        env:
          PACKAGE_RESULT: ${{ job.status }}
          INVENTORY_RESULT: ${{ steps.inventory.outcome }}
        run: |
          mkdir -p diagnostics
          echo "Unsigned core package for $RELEASE_PLATFORM ($RELEASE_VERSION, $RELEASE_SOURCE): $PACKAGE_RESULT. Candidate inventory: $INVENTORY_RESULT." | tee diagnostics/package-status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failed package diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: |
            diagnostics/
            dist/
            startup-evidence/
            lifecycle-evidence/
            wayland-evidence/
            appimage-x11-evidence/
            appimage-wayland-evidence/
          if-no-files-found: error
          overwrite: true

  aggregate:
    needs: [preflight, regression, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      publication_ready: ${{ steps.inventory.outputs.publication_ready }}
    env:
      RELEASE_SOURCE: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      REGRESSION_RESULT: ${{ needs.regression.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'engines/rdp/Cargo.lock', 'engines/wayland/Cargo.lock', 'docs/parity-evidence/rdp-prototype/Cargo.lock') }}
      - name: Provision the pinned toolchain for independent locked dependency resolution
        shell: bash
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Provision the read-only AppImage inspector
        run: sudo apt-get install -y squashfs-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: downloaded
      - name: Revalidate complete three-platform inventory
        id: inventory
        shell: bash
        run: |
          python scripts/release-delivery.py aggregate --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" \
            --candidates downloaded --output assembled --regression-result "$REGRESSION_RESULT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Retain assembled unsigned assets
        uses: actions/upload-artifact@v4
        with:
          name: assembled-unsigned-core
          path: assembled/
          if-no-files-found: error
          overwrite: true
      - name: Summarize publication readiness
        if: always() && !cancelled()
        shell: bash
        env:
          ASSEMBLY_RESULT: ${{ steps.inventory.outcome }}
          PUBLICATION_READY: ${{ steps.inventory.outputs.publication_ready }}
        run: |
          echo "Three-platform assembly: $ASSEMBLY_RESULT. Publication ready: ${PUBLICATION_READY:-false}." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLICATION_READY" != true ]]; then
            echo 'Publication requires native Wayland and two-version lifecycle evidence on all three platforms.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: [preflight, aggregate]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.preflight.outputs.tag_publish_event == 'true' && needs.aggregate.outputs.publication_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SOURCE: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: assembled-unsigned-core
          path: assembled
      - name: Publish only the exact validated tagged assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release-delivery.py publish --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --output assembled --repo "$GITHUB_REPOSITORY"

  windows-x-fixture:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.windows_x_fixture
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Provision pinned native build and clipboard inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'termcraft-x11-fixture'
          $null = New-Item -ItemType Directory -Path $work
          function Download-Pinned([string]$Url, [string]$Sha256, [string]$File) {
            Invoke-WebRequest -Uri $Url -OutFile $File -TimeoutSec 300
            if ((Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash -ne $Sha256) {
              throw "Tool or source archive checksum mismatch: $File"
            }
          }
          $contract = Get-Content packaging/x11/native/source-contract.json -Raw | ConvertFrom-Json
          Download-Pinned $contract.windows.source_archive_url $contract.windows.source_archive_sha256 (Join-Path $work 'source.tar.gz')
          $zipTools = @{
            'jom' = @('https://download.qt.io/official_releases/jom/jom_1_1_4.zip',
              'd533c1ef49214229681e90196ed2094691e8c4a0a0bef0b2c901debcb562682b')
            'nasm' = @('https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip',
              '3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6')
            'perl' = @('https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54022_64bit/strawberry-perl-5.40.2.2-64bit-portable.zip',
              '7df5cdc41e8638c00b2aa00cccc69ec8cd5a5ad0ec265c81f389beffb53b6920')
            'winflexbison' = @('https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip',
              '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135')
          }
          foreach ($name in $zipTools.Keys) {
            $archive = Join-Path $work "$name.zip"
            Download-Pinned $zipTools[$name][0] $zipTools[$name][1] $archive
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $work $name)
          }
          $msys = Join-Path $work 'gperf'
          $null = New-Item -ItemType Directory -Path $msys
          $msysPackages = @{
            'gperf-3.1-6-x86_64.pkg.tar.zst' = @('393a048d6eb490e572951df7a99e0548cf064703adce365f960f3c0b45996256', 'usr/bin/gperf.exe')
            'gcc-libs-13.4.0-1-x86_64.pkg.tar.zst' = @('3dfd7663495e17ec10df44a9fa431c4849d96ed1cc6e1cf3dd145ad5ce5d38bd',
              'usr/bin/msys-gcc_s-seh-1.dll', 'usr/bin/msys-stdc++-6.dll')
            'msys2-runtime-3.6.2-2-x86_64.pkg.tar.zst' = @('94b77379f0da40a6e6b3c1485487ff9bbb48d8d0fe1f5c402c310d9bebabbe7c', 'usr/bin/msys-2.0.dll')
          }
          foreach ($name in $msysPackages.Keys) {
            $archive = Join-Path $work $name
            $digest = $msysPackages[$name][0]
            $members = @($msysPackages[$name] | Select-Object -Skip 1)
            Download-Pinned "https://repo.msys2.org/msys/x86_64/$name" $digest $archive
            tar.exe -xf $archive -C $msys @members
            if ($LASTEXITCODE -ne 0) { throw "Could not extract pinned gperf input: $name" }
          }
          python -m venv (Join-Path $work 'python')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $work 'python/Scripts/python.exe'
          $requirements = Join-Path $work 'requirements.txt'
          $wheels = Join-Path $work 'wheels'
          @'
          lxml==6.1.3 --hash=sha256:7ae4949f212a53b007dbc355884fda122545c5764a54256c9217e419a62a6559
          Mako==1.4.3 --hash=sha256:723296007c870bfd6b3f0c3230dba7198096e5269297ebf5e4eff9e7ffa39d4f
          MarkupSafe==3.0.4 --hash=sha256:fdb4ca07ab75ffadab4a8b135ad59cdbb3156b99310f3d565370da74a15d6bd3
          PyYAML==6.0.4 --hash=sha256:0db75f402e99c25239003a499c214a61947b4ef5312af34711d4c63e5c179318
          meson==1.12.1 --hash=sha256:930bc7542cbd9f57009e182fd014eba48cf1a0180a7b9006d2d32d8f168d8b02
          ninja==1.13.2 --hash=sha256:1293f4078278b70d0ee4b6cc8f3a9e030656c9b2f59909970343c4fe76070118
          python-xlib==0.33 --hash=sha256:c3534038d42e0df2f1392a1b30a15a4ff5fdc2b86cfa94f072bf11b10a164398
          six==1.17.0 --hash=sha256:4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
          '@ | Set-Content -LiteralPath $requirements -Encoding utf8
          & $python -m pip download --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r $requirements --dest $wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-index --find-links $wheels --require-hashes -r $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and inventory the private x64 candidate
        id: build_x11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'termcraft-x11-fixture'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio 2022 x64 tools are required.' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $arguments = @{
            SourceArchive = Join-Path $work 'source.tar.gz'
            BuildDirectory = Join-Path $work 'build'
            PythonExecutable = Join-Path $work 'python/Scripts/python.exe'
            GitUnixBin = Join-Path $env:ProgramFiles 'Git/usr/bin'
            ToolDirectories = @('jom', 'nasm/nasm-2.16.03', 'perl/perl/bin', 'winflexbison', 'gperf/usr/bin') |
              ForEach-Object { Join-Path $work $_ }
            Jobs = 2
          }
          ./packaging/x11/native/build-private-windows.ps1 @arguments
      - name: Verify X11 wire behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'termcraft-x11-fixture'
          $python = Join-Path $work 'python/Scripts/python.exe'
          $build = Join-Path $work 'build'
          $candidate = Join-Path $build 'x11/windows-x86_64-private1'
          $inventory = Join-Path $build 'candidate-inventory.json'
          $digest = (Get-FileHash -LiteralPath $inventory -Algorithm SHA256).Hash.ToLowerInvariant()
          Get-Content (Join-Path $build 'build-inputs.json')
          $engine = (Get-FileHash -LiteralPath (Join-Path $candidate 'vcxsrv.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "VcXsrv SHA-256 $engine"
          "Inventory SHA-256 $digest"
          & $python tests/windows_xdmcp_candidate.py --candidate $candidate --inventory $inventory --evidence (Join-Path $work 'wire-evidence')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated clipboard behavior
        if: always() && !cancelled() && steps.build_x11.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'termcraft-x11-fixture'
          $python = Join-Path $work 'python/Scripts/python.exe'
          $candidate = Join-Path $work 'build/x11/windows-x86_64-private1'
          $inventory = Join-Path $work 'build/candidate-inventory.json'
          $digest = (Get-FileHash -LiteralPath $inventory -Algorithm SHA256).Hash.ToLowerInvariant()
          & $python tests/windows_x_clipboard.py --candidate $candidate --inventory $inventory --inventory-sha256 $digest --wheel-directory (Join-Path $work 'wheels') --evidence (Join-Path $work 'clipboard-evidence') --address 127.0.0.2 --xdmcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain private X11 fixture evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-private-x11
          path: |
            ${{ runner.temp }}/termcraft-x11-fixture/build/build-inputs.json
            ${{ runner.temp }}/termcraft-x11-fixture/build/candidate-inventory.json
            ${{ runner.temp }}/termcraft-x11-fixture/wire-evidence/
            ${{ runner.temp }}/termcraft-x11-fixture/clipboard-evidence/
          if-no-files-found: ignore
          overwrite: true
