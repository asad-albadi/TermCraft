[package]
name = "termcraft-rdp-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cap-std = "=4.0.3"
ironrdp-svc = "=0.10.0"
ironrdp-connector = "=0.12.0"
ironrdp-cliprdr = "=0.9.0"
ironrdp-core = "=0.3.0"
ironrdp-pdu = {version="=0.11.0",features=["std"]}
ironrdp-graphics = "=0.11.0"
ironrdp-session = "=0.13.0"
ironrdp-tokio = "=0.12.0"
tokio = {version="1",features=["rt","net","sync","time","io-util","macros"]}
tokio-rustls = {version="0.26",default-features=false,features=["ring","tls12"]}
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
rustls-platform-verifier = "=0.7.1"
x509-cert = {version="0.2",default-features=false,features=["std"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
zeroize = "1.9.2"
sha2 = "=0.11.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "=3.27.0"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_Communication", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
