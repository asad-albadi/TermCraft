ServerName "TermCraft Owned Qualification"
ServerType standalone
DefaultServer on
UseIPv6 off
User proftpd
Group nogroup
AuthPAM off
RequireValidShell off
DefaultRoot /srv/ftp
AllowOverwrite on
SystemLog /evidence/proftpd-2121.log
PidFile /evidence/proftpd-2121.pid
ScoreboardFile /run/proftpd/scoreboard-2121
Port 2121
<Directory /srv/ftp>
<Limit ALL>
AllowAll
</Limit>
</Directory>
