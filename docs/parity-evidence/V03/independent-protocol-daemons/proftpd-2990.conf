ServerName "TermCraft Owned Qualification"
ServerType standalone
DefaultServer on
UseIPv6 off
User proftpd
Group nogroup
AuthPAM off
RequireValidShell off
DefaultRoot /srv/ftp
AllowOverwrite on
SystemLog /evidence/proftpd-2990.log
PidFile /evidence/proftpd-2990.pid
ScoreboardFile /run/proftpd/scoreboard-2990
Port 2990
<Directory /srv/ftp>
<Limit ALL>
AllowAll
</Limit>
</Directory>
LoadModule mod_tls.c
<IfModule mod_tls.c>
TLSEngine on
TLSRequired on
TLSProtocol TLSv1.2 TLSv1.3
TLSRSACertificateFile /evidence/server.pem
TLSRSACertificateKeyFile /evidence/server.key
TLSOptions NoSessionReuseRequired UseImplicitSSL
TLSLog /evidence/tls-2990.log
</IfModule>
