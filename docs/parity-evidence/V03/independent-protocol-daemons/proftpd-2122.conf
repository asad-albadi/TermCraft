ServerName "TermCraft Owned Qualification"
ServerType standalone
DefaultServer on
UseIPv6 off
User proftpd
Group nogroup
AuthPAM off
RequireValidShell off
DefaultRoot /srv/ftp
AllowOverwrite on
SystemLog /evidence/proftpd-2122.log
PidFile /evidence/proftpd-2122.pid
ScoreboardFile /run/proftpd/scoreboard-2122
Port 2122
<Directory /srv/ftp>
<Limit ALL>
AllowAll
</Limit>
</Directory>
LoadModule mod_tls.c
<IfModule mod_tls.c>
TLSEngine on
TLSRequired on
TLSProtocol TLSv1.2 TLSv1.3
TLSRSACertificateFile /evidence/server.pem
TLSRSACertificateKeyFile /evidence/server.key
TLSOptions NoSessionReuseRequired
TLSLog /evidence/tls-2122.log
</IfModule>
