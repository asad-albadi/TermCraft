[package]
name = "real-wayland-rd-provider-private"
version = "0.1.0-real-rd.1"
edition = "2024"
[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "=0.11.1"
serde_json = "1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
zbus = "=5.19.0"
tokio = { version = "1", features = ["rt", "time", "macros"] }
