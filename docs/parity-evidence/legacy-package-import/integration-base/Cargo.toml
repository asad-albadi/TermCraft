[package]
name = "harbor-workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
nfsembed = "=0.3.0"
async-trait = "=0.1.89"
chrono = "=0.4.45"
des = { version = "=0.9.0", features = ["zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
rfd = "0.17"
russh = { version = "=0.65.4", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = { version = "=4.0.0", features = ["raw-string"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "fs"] }
zeroize = "1.9.2"
hmac = "0.13"
sha1 = "0.11"
sha2 = "=0.11.1"
getrandom = "0.3.4"
subtle = "2"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
smol_str = "=0.2.2"
regex = "=1.12.2"
encoding_rs = "=0.8.35"
url = "=2.5.8"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
base64 = "=0.22.1"
tempfile = "=3.27.0"
arboard = { version = "=3.6.1", default-features = false }
interprocess = { version = "=2.4.9", features = ["tokio"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
futures = "=0.3.32"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
flate2 = "=1.1.11"
tar = { version = "=0.4.46", default-features = false }
libloading = "=0.8.9"
xkeysym = "=0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-screen-capture-kit = { version = "=0.3.2", path = "vendor/objc2-screen-capture-kit" }
objc2-core-graphics = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
block2 = "=0.6.2"

winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }

[patch.crates-io]
clipboard-win = { path = "vendor/clipboard-win" }

[target.'cfg(windows)'.dependencies]
widestring = "=1.2.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_Devices_Communication", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"
x11rb = { version = "=0.13.2", features = ["xtest", "xkb"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
x11rb = "=0.13.2"
tempfile = "=3.27.0"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
