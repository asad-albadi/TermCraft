[package]
name = "termcraft-rdp-engine-evaluation"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ironrdp = { version = "=0.17.0", default-features = false, features = ["core", "pdu", "connector", "graphics", "session", "input", "server", "cliprdr"] }
ironrdp-tokio = "=0.10.0"
tokio = {version="1", features=["rt-multi-thread","net","time","sync","io-util","macros"]}
tokio-rustls = {version="0.26",default-features=false,features=["ring","tls12"]}
rustls = {version="0.23",default-features=false,features=["ring","std","tls12"]}
x509-cert = {version="0.2",default-features=false,features=["std"]}
anyhow = "1"
async-trait = "0.1"

tempfile = "=3.27.0"

zeroize = "1.9.2"
