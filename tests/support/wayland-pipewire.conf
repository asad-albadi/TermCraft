# Private synthetic-only daemon; no device monitors, desktop capture or policy agent.
context.properties = { core.daemon = true core.name = e03-private-pipewire mem.warn-mlock = false support.dbus = false }
context.spa-libs = { support.* = support/libspa-support }
context.modules = [
 { name = libpipewire-module-protocol-native }
 { name = libpipewire-module-spa-node-factory }
 { name = libpipewire-module-metadata }
 { name = libpipewire-module-client-node }
 { name = libpipewire-module-link-factory }
 { name = libpipewire-module-access args = { access.legacy = true } }
]
context.objects = [
 { factory = spa-node-factory args = { factory.name = support.node.driver node.name = e03-private-driver priority.driver = 20000 } }
]
