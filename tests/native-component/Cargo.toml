[package]
name = "x01-native-component-private"
version = "0.1.0"
edition = "2024"
[dependencies]
sha2 = "=0.11.1"
tempfile = "=3.27.0"
zeroize = "1.9.2"
getrandom = "0.3.4"
libc = "0.2"
tokio = { version = "1", features = ["sync"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
