[package]
name = "d02-device-native-component"
version = "0.1.0-d02-device-20261125"
edition = "2024"
[dependencies]
cap-std = "=4.0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_Communication", "Win32_Devices_SerialCommunication", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
